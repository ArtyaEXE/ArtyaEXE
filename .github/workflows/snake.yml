name: snake

# Redraws the contribution-graph snake shown in the profile README, into the `output` branch.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#d97757
            dist/snake-dark.svg?palette=github-dark&color_snake=#d97757&color_background=#0d1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update the snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
