<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Artur Arutyunyan — full-stack developer: web apps, Telegram bots and Mini Apps, tools for Claude Code">
